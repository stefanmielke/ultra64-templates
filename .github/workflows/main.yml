name: Build All Projects

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        run: |
          docker --version

      - name: Find all project folders
        id: list_folders
        run: |
          echo "folders=$(ls -d */ | sed 's:/$::' | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_ENV

      - name: Build each project
        run: |
          for folder in $(echo ${{ env.folders }} | jq -r '.[]'); do
            echo "Building $folder..."
            cd "$folder"
            chmod +x docker-prepare.sh docker-build.sh
            ./docker-prepare.sh
            ./docker-build.sh
            cd ..
          done
